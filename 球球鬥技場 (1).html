<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>球球鬥技場</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:#eee;font-family:sans-serif;height:100vh;width:100vw;overflow:hidden;touch-action:none;display:flex;flex-direction:column;background:#080808}
#ui{width:100%;background:#141414;padding:6px;flex-shrink:0}
.R{display:flex;gap:6px;margin-bottom:6px}
.R:last-child{margin-bottom:0}
.R button{flex:1;padding:12px 5px;font-size:14px;border-radius:8px;border:none;color:#fff;font-weight:bold;cursor:pointer;touch-action:none}
#bS{background:#2a2a2a;border:1.5px solid #ffd700!important;color:#ffd700}
#bP{background:#2a2a2a;color:#fff;border:1.5px solid #555}
.bs{background:#1e8449;color:#fff}
.b2{background:#e67e22;color:#1a1200}
.bi{background:#e67e22;color:#1a1200}
.bc{background:#4a4a4a;color:#fff}
canvas{display:block;background:#0a0a0a;border:2px solid #3a3a3a;touch-action:none;flex:1;width:100%}
#info{position:absolute;bottom:6px;left:12px;font-size:12px;color:#999;pointer-events:none;z-index:20}
.M{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}
.P{background:#1a1a1a;border:2px solid #444;border-radius:14px;padding:20px;max-width:92%;width:400px;max-height:82vh;overflow-y:auto;position:relative;color:#fff}
.P h3{margin:0 0 12px;text-align:center;color:#ffd700;font-size:20px}
.G{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.G button{padding:11px 4px;font-size:13px;border-radius:8px;border:none;color:#fff;font-weight:bold;cursor:pointer}
.BG{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.BG button{padding:11px 4px;font-size:13px;border-radius:8px;border:none;color:#fff;font-weight:bold;cursor:pointer}
.X{position:absolute;top:12px;right:12px;background:#e74c3c!important;color:#fff!important;width:30px;height:30px;padding:0;border-radius:50%;border:none;font-size:17px;cursor:pointer}
#errbox{position:fixed;top:6px;left:6px;right:6px;z-index:9999;display:none;background:rgba(120,10,10,.94);color:#fff;border:1px solid #ff5a5a;border-radius:8px;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
  <div class="R"><button id="bS" onclick="SM('sandbox')">🤖AI大亂鬥</button><button id="bP" onclick="SM('player')">⚔️玩家對戰</button></div>
  <div class="R"><button class="bs" oncontextmenu="return false" onpointerdown="sLP(0)" onpointerup="cLP()" onclick="oSM(0)">➕生成角色</button><button class="b2" oncontextmenu="return false" onpointerdown="sLP(1)" onpointerup="cLP()" onclick="oSM(1)">➕生成角色</button></div>
  <div class="R"><button class="bi" onclick="dropItem()">🎁投放道具</button><button class="bc" onclick="clearAll()">🗑️清空</button></div>
</div>
<canvas id="gc"></canvas>
<div id="info">存活：<span id="ac">0</span> | 💡長按刪除/連點2下控制</div>

<div id="sM" class="M"><div class="P">
  <button class="X" onclick="cSM()">✕</button><h3>選擇角色</h3>
  <div style="display:flex;gap:10px;margin-bottom:14px;justify-content:center;align-items:center">
    <input type="number" id="sC" value="1" min="1" max="50" style="width:60px;padding:6px;border-radius:6px;text-align:center">
    <span>數量</span>
    <button id="tT" onclick="tTeam()" style="background:#c0392b;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer">🔴紅方</button>
  </div>
  <div class="G">
    <button onclick="DS('trident')" style="background:#3498db">⚔️三叉戟</button>
    <button onclick="DS('vampire')" style="background:#c0392b">🧛吸血鬼</button>
    <button onclick="DS('sword')" style="background:#f1c40f;color:#000">🛡️聖劍</button>
    <button onclick="DS('radiation')" style="background:#2ecc71">☢️輻射</button>
    <button onclick="DS('schrodinger')" style="background:#9b59b6">🐊薛定鱷</button>
    <button onclick="DS('poop')" style="background:#6b3e15">💩大便</button>
    <button onclick="DS('fire')" style="background:#e74c3c">🔥火</button>
    <button onclick="DS('ufo')" style="background:#7f8c8d">🛸UFO</button>
    <button onclick="DS('chess')" style="background:#34495e">♟️西洋棋</button>
    <button onclick="DS('executioner')" style="background:#8e44ad">⚖️行刑官</button>
    <button onclick="DS('dog')" style="background:#d4a373;color:#000">🐶狗</button>
    <button onclick="DS('explorer')" style="background:#16a085">🧭探險家</button>
    <button onclick="DS('miao')" style="background:#ff9f43;color:#000">😺妙脆角</button>
    <button onclick="DS('dogNurse')" style="background:#FFE4E1;color:#000">🐶狗奶</button>
    <button onclick="DS('icer')" style="background:#7fd6ff;color:#000">🧊冰冰冰</button>
  </div>
  <div class="BG">
    <button oncontextmenu="return false" onpointerdown="sBrLP()" onpointerup="cBrLP()" onclick="DS('brother')" style="background:linear-gradient(45deg,#f00,#0f0,#00f);color:#fff">👑大哥</button>
    <button onclick="DS('twins')" style="background:linear-gradient(45deg,#f1c40f,#5dade2);color:#000">👥雙子</button>
    <button onclick="DS('bookpen')" style="background:linear-gradient(45deg,#f3e6b8,#b9895a);color:#000">📖書與筆</button>
  </div>
</div></div>

<div id="zM" class="M"><div class="P">
  <button class="X" onclick="cZM()">✕</button><h3>💀屍潮</h3>
  <p style="text-align:center;color:#ccc">選擇難度：</p>
  <div class="G" style="grid-template-columns:repeat(2,1fr)">
    <button onclick="sZ('easy')" style="background:#2ecc71">簡單1波</button>
    <button onclick="sZ('normal')" style="background:#f1c40f;color:#000">普通5波</button>
    <button onclick="sZ('hard')" style="background:#e67e22">困難10波</button>
    <button onclick="sZ('extreme')" style="background:#e74c3c">極限20波</button>
  </div>
</div></div>

<div id="zEM" class="M"><div class="P">
  <h3 id="zET">🏆勝利!</h3>
  <p id="zED" style="text-align:center;color:#ccc"></p>
  <button onclick="eZ()" style="width:100%;padding:12px;border:none;border-radius:8px;background:#3498db;color:#fff;font-weight:bold">返回</button>
</div></div>

<script>
// ===== Error Handler =====
var ge = function(id) { return document.getElementById(id); };
(function() {
  var b;
  window.showErr = function(m) {
    try {
      if (!b) {
        b = document.createElement('div');
        b.id = 'errbox';
        b.onclick = function() { b.style.display = 'none'; };
        document.body.appendChild(b);
      }
      b.style.display = 'block';
      b.textContent = '⚠️ ' + m;
    } catch(e) {}
  };
  window.onerror = function(m, s, l) { showErr(m + ' @' + l); };
})();

// ===== Audio =====
var Ax = window.AudioContext || window.webkitAudioContext;
var ax = Ax ? new Ax() : null;
var aOn = false;
function rA() { if (ax && ax.state === 'suspended') ax.resume(); aOn = true; }
addEventListener('click', rA, { once: true });
addEventListener('touchstart', rA, { once: true });
function snd(t) {
  if (!aOn || !ax) return;
  try {
    var o = ax.createOscillator(), g = ax.createGain();
    o.connect(g); g.connect(ax.destination);
    var c = ax.currentTime;
    if (t == 'h') { o.frequency.setValueAtTime(220,c); o.frequency.exponentialRampToValueAtTime(80,c+.1); g.gain.setValueAtTime(.08,c); g.gain.exponentialRampToValueAtTime(.01,c+.1); o.start(c); o.stop(c+.1); }
    else if (t == 'l') { o.type='sine'; o.frequency.setValueAtTime(400,c); o.frequency.linearRampToValueAtTime(600,c+.2); g.gain.setValueAtTime(.1,c); g.gain.linearRampToValueAtTime(0,c+.25); o.start(c); o.stop(c+.25); }
    else if (t == 's') { o.type='triangle'; o.frequency.setValueAtTime(300,c); o.frequency.exponentialRampToValueAtTime(800,c+.15); g.gain.setValueAtTime(.12,c); g.gain.exponentialRampToValueAtTime(.01,c+.15); o.start(c); o.stop(c+.15); }
    else if (t == 'u') { o.type='sawtooth'; o.frequency.setValueAtTime(100,c); o.frequency.exponentialRampToValueAtTime(50,c+.5); g.gain.setValueAtTime(.2,c); g.gain.exponentialRampToValueAtTime(.01,c+.6); o.start(c); o.stop(c+.6); }
    else if (t == 'd') { o.type='sawtooth'; o.frequency.setValueAtTime(300,c); o.frequency.exponentialRampToValueAtTime(30,c+.4); g.gain.setValueAtTime(.15,c); g.gain.exponentialRampToValueAtTime(.01,c+.4); o.start(c); o.stop(c+.4); }
  } catch(e) {}
}

// ===== Globals =====
var cv = ge('gc'), cx = cv.getContext('2d');
var A = { x:10, y:10, w:780, h:580 };
var B=[], PJ=[], TF=[], SF=[], PZ=[], IT=[], SU=[], SN=[], TA=[], TG=[], TB=[], mF=[];
var ICE=[]; // 冰冰冰的冰面方塊
var SK={x:0,y:0,t:0,i:6}, LT=performance.now(), TS=false, TSE=0;
var GM='sandbox', SP=false, PI={x:0,y:0,on:false}, ITmr=0, ST=0, ZM=null;
var FR = 0; // 幀計數（毒爆 15 幀限制用）
var ZD = { easy:{w:1,a:1e9}, normal:{w:5,a:10}, hard:{w:10,a:5}, extreme:{w:20,a:0} };
var TC = ['#e74c3c','#3498db','#9b59b6'];
var TN = ['🔴紅','藍','紫'];
var EJ = [];   // 條件2（枷鎖）進行中的清單
var EG = { jb:new Map(), ie:new Map(), di:new Map(), at:0 };   // jb=越獄  ie=立即執行（最低0）
function uEJ(dt) {   // 定身5秒；每秒 3+越獄層數×2 傷害共5秒；結束後 立即執行+=原越獄層數、越獄歸0
  for (var i=EJ.length-1;i>=0;i--) {
    var j=EJ[i]; j.tm-=dt;
    if (j.t.hp<=0) { EJ.splice(i,1); continue; }
    var due=Math.min(5, Math.floor((5000-j.tm+1e-3)/1000));
    while (j.ticks<due) { j.ticks++; j.t.tD(3+j.n*2,'estun'); }
    if (j.tm<=0) { if (j.t.hp>0) { egAdd('ie',j.t,j.n); EG.jb.set(j.t,0); } EJ.splice(i,1); }
  }
}
function egGet(m, b) { return EG[m].get(b) || 0; }
function egAdd(m, b, n) {
  if (!b) return;
  var v = Math.max(0, egGet(m, b) + n); EG[m].set(b, v);
  if (n > 0) aT(b.x, b.y-34, (m==='jb'?'越獄':'立即執行')+'+'+n, m==='jb'?'#d6a2ff':'#ff7a7a', 900);
}
var ITY = { shield:{c:'#3498db',i:'🛡️'}, sword:{c:'#f1c40f',i:'⚔️'}, portal:{c:'#9b59b6',i:'🌀'}, medkit:{c:'#2ecc71',i:'💊'}, bomb:{c:'#e74c3c',i:'💣'}, clock:{c:'#bdc3c7',i:'⏰'} };
var BC = { fire:'#e74c3c', ice:'#00bfff', poison:'#800080', knockback:'#9acd32', electric:'#ffd700', triple:'#00ffff', normal:'#00ff00', shadow:'#7B5A82' };
var B2C = { poison_big:'#800080', electric_big:'#ffd700', triple:'#00bfff', atomic:'#006400', ice_360:'#0000ff', random:'#00ff00', fire_field:'#ff0000', normal:'#00ff00', shadow:'#7B5A82' };

// ===== Resize =====
function rsz() {
  var h = ge('ui').offsetHeight;
  cv.style.width = '100%';
  cv.style.height = (innerHeight - h) + 'px';
  setTimeout(function() {
    cv.width = cv.offsetWidth;
    cv.height = cv.offsetHeight;
    A.w = cv.width - 20;
    A.h = cv.height - 20;
  }, 0);
}
addEventListener('resize', rsz);
addEventListener('load', rsz);
setTimeout(rsz, 100);

// ===== Input =====
function uI(e) {
  if (!PI.on) return;
  var r = cv.getBoundingClientRect();
  PI.x = (e.clientX || (e.touches && e.touches[0].clientX)) - r.left;
  PI.y = (e.clientY || (e.touches && e.touches[0].clientY)) - r.top;
}
cv.addEventListener('pointerdown', function(e) { if (FIN) { FIN = null; return; }   // 點一下可跳過斬殺動畫
  PI.on = true; uI(e); oCD(e); });
cv.addEventListener('pointermove', uI);
cv.addEventListener('pointerup', function(e) { PI.on = false; oCU(e); });

// ===== Mode =====
function SM(m) {
  GM = m;
  ge('bS').style.borderColor = m=='sandbox' ? '#ffd700' : '#555';
  ge('bP').style.borderColor = m=='player' ? '#ffd700' : '#555';
}

// ===== Long Press =====
var lT = null, lF = false;
function sLP(t) { lF = false; if (lT) clearTimeout(lT); lT = setTimeout(function() { lF = true; ge('zM').style.display = 'flex'; }, 500); }
function cLP() { if (lT) { clearTimeout(lT); lT = null; } }
var brT = null;
function sBrLP() { if (brT) clearTimeout(brT); brT = setTimeout(function() { DS('brother2'); }, 500); }
function cBrLP() { if (brT) { clearTimeout(brT); brT = null; } }

// ===== Zombie Mode =====
function cZM() { ge('zM').style.display = 'none'; }
function sZ(d) {
  cZM(); ICE=[]; EJ=[]; B=[]; PJ=[]; SN=[]; PZ=[]; SF=[]; TF=[]; TA=[]; TG=[]; TB=[]; mF=[];
  var c = ZD[d];
  ZM = { d:d, w:1, tw:c.w, ai:c.a, st:0, kc:0, go:false, ov:false };
  spZ(25);
  aT(cv.width/2, cv.height/2, '💀屍潮來襲!', '#e74c3c', 2500);
}
function spZ(n) {
  for (var i = 0; i < n; i++) {
    var z = new Bl('zombie', 10+30+Math.random()*(A.w-60), 10+30+Math.random()*(A.h-60), false, 2);
    z.hp = 50 + ZM.w * 50; z.mhp = z.hp; z.zD = 1 + ZM.w;
    B.push(z);
  }
}
function eZW(w) {
  ZM.ov = true;
  ge('zET').textContent = w ? '🏆勝利!' : '💀失敗';
  ge('zED').textContent = w ? '擊敗所有僵屍!' : '全滅...';
  ge('zEM').style.display = 'flex';
}
function eZ() {
  ge('zEM').style.display = 'none';
  ZM = null; ICE=[]; EJ=[]; B=[]; PJ=[]; SN=[]; PZ=[]; SF=[]; TF=[]; TA=[]; TG=[]; TB=[]; mF=[];
  SM('sandbox');
}

// ===== Spawn Modal =====
function oSM(t) { if (lF) { lF = false; return; } if (t !== undefined) ST = t; uTT(); ge('sM').style.display = 'flex'; SP = true; }
function cSM() { ge('sM').style.display = 'none'; SP = false; }
function tTeam() { ST = (ST + 1) % 3; uTT(); }
function uTT() { var e = ge('tT'); if (e) e.textContent = TN[ST]; }

// ===== Canvas Tap =====
var pTmr = null, pTgt = null, lTapT = 0, lTapTgt = null;
function gBA(x, y) { for (var i = B.length-1; i >= 0; i--) if (Math.hypot(B[i].x-x, B[i].y-y) < B[i].r+10) return B[i]; return null; }
function oCD(e) {
  var r = cv.getBoundingClientRect();
  var x = (e.clientX || (e.touches && e.touches[0].clientX)) - r.left;
  var y = (e.clientY || (e.touches && e.touches[0].clientY)) - r.top;
  var b = gBA(x, y);
  if (!b) return;
  var n = performance.now();
  if (lTapTgt === b && n - lTapT < 300) {
    if (b.iP) { b.iP = false; aT(b.x, b.y-20, '🤖人機', '#aaa', 800); }
    else {
      for (var j = 0; j < B.length; j++) if (B[j].iP) { B[j].iP = false; aT(B[j].x, B[j].y-20, '🤖人機', '#aaa', 800); }
      b.iP = true; aT(b.x, b.y-20, '🎮控制', '#0f0', 800);
    }
    lTapTgt = null; return;
  }
  lTapT = n; lTapTgt = b; pTgt = b;
  pTmr = setTimeout(function() {
    if (pTgt && pTgt.hp > 0 && !pTgt.iP) { pTgt.hp = 0; aT(pTgt.x, pTgt.y, '🗑️', '#f00', 800); pTgt = null; }
    else if (pTgt && pTgt.iP) { aT(pTgt.x, pTgt.y-20, '🎮無法刪除', '#ff0', 1000); pTgt = null; }
  }, 500);
}
function oCU() { if (pTmr) { clearTimeout(pTmr); pTmr = null; } pTgt = null; }

// ===== Spawn =====
function DS(tp) {
  try {
    var cn = parseInt(ge('sC').value) || 1;
    if (cn < 1) cn = 1; if (cn > 50) cn = 50;
    if (tp === 'twins') {
      if (ZM && !ZM.ov) { var pb=0; for (var j=0;j<B.length;j++) if (B[j].iP && B[j].k!=='zombie') pb++; if (pb===0) ZM.go=true; }
      spTw(ST, GM==='player'); return;
    }
    if (tp === 'brother2') {
      if (ZM && !ZM.ov) { var pb=0; for (var j=0;j<B.length;j++) if (B[j].iP && B[j].k!=='zombie') pb++; if (pb===0) ZM.go=true; }
      var sp = fS(A.w/2+10, A.h/2+10);
      B.push(new Bl('brother2', sp.x, sp.y, GM==='player', ST));
      aT(sp.x, sp.y, '二哥登場!', '#0ff', 1500); return;
    }
    if (ZM && !ZM.ov) {
      var pb=0, ab=0;
      for (var j=0; j<B.length; j++) { if (B[j].iP && B[j].k!=='zombie') pb++; if (!B[j].iP && B[j].k!=='zombie') ab++; }
      var mp = pb===0 && ab===0;
      if (mp && pb>=1) { aT(cv.width/2, cv.height/2, '玩家球只能1個', '#e74c3c', 1200); return; }
      if (!mp && ab>=ZM.ai) { aT(cv.width/2, cv.height/2, '人機上限', '#e74c3c', 1200); return; }
      var sp = fS(A.w/2+10, A.h/2+10);
      var b = new Bl(tp, sp.x, sp.y, mp, 0);
      B.push(b); if (mp) ZM.go = true; return;
    }
    for (var n=0; n<cn; n++) {
      if (GM === 'player') {
        var oi=-1; for (var j=0;j<B.length;j++) if (B[j].iP) { oi=j; break; }
        if (oi !== -1) B.splice(oi, 1);
        var sp = fS(A.w/2+10, A.h/2+10);
        B.push(new Bl(tp, sp.x, sp.y, true, ST));
      } else {
        var px = 10+40+Math.random()*Math.max(10,A.w-80);
        var py = 10+40+Math.random()*Math.max(10,A.h-80);
        if (tp === 'chess') { px = A.w/2+10; py = A.h-30; }
        var sp = fS(px, py);
        B.push(new Bl(tp, sp.x, sp.y, false, ST));
        if (tp === 'explorer') break;
      }
    }
  } catch(er) { showErr('DS:' + er.message); }
}
function spTw(tm, iP) {
  var sp = fS(A.w/2+10, A.h/2+10);
  var g = new Bl('twinGold', sp.x-20, sp.y, false, tm);
  var d = new Bl('twinDiamond', sp.x+20, sp.y, false, tm);
  g.tP = d; d.tP = g;
  if (iP) { if (Math.random() < .5) g.iP = true; else d.iP = true; }
  B.push(g); B.push(d);
  aT(sp.x, sp.y-30, '👥雙子!', '#f1c40f', 1500);
}
function fS(px, py) {
  for (var a = 0; a < 24; a++) {
    var x = a ? 10+30+Math.random()*Math.max(10,A.w-60) : px;
    var y = a ? 10+30+Math.random()*Math.max(10,A.h-60) : py;
    var ok = true;
    for (var i = 0; i < B.length; i++) if (B[i].hp > 0 && Math.hypot(B[i].x-x, B[i].y-y) < B[i].r+34) { ok = false; break; }
    if (ok) return { x:x, y:y };
  }
  return { x:Math.max(30,Math.min(A.w,px)), y:Math.max(30,Math.min(A.h,py)) };
}

// ===== Types =====
var TY = {
  trident:{n:'三叉戟',c:'#4a90e2',hp:100,r:18,bC:2500,mC:10000,uC:15000},

// ===== Collision =====
function cCol() {
  for (var i=0;i<B.length;i++) for (var j=i+1;j<B.length;j++) {

      if (aDs&&!bDs) { b.x+=Math.cos(an)*ov; b.y+=Math.sin(an)*ov; }
      else if (bDs&&!aDs) { a.x-=Math.cos(an)*ov; a.y-=Math.sin(an)*ov; }
      else {
        a.x-=Math.cos(an)*ov*.5; a.y-=Math.sin(an)*ov*.5;
        b.x+=Math.cos(an)*ov*.5; b.y+=Math.sin(an)*ov*.5;
        var tv=a.vx; a.vx=b.vx*.7; b.vx=tv*.7;
        tv=a.vy; a.vy=b.vy*.7; b.vy=tv*.7;
      }
      if (aDs&&a.iE(b)) a.dHit(b);
      if (bDs&&b.iE(a)) b.dHit(a);
      var nw=performance.now(), cd=a.k==='zombie'||b.k==='zombie'?5e3:500;
      if (nw-a.lcT>cd && nw-b.lcT>cd) {
        a.lcT=b.lcT=nw;
        if (a.iE(b)) {
          var aD,bD;
          if (a.k==='zombie') aD=a.zD||1; else if (a.k==='diamondMinion') aD=5; else if (a.k==='jadeRabbit') aD=3; else if (a.k==='dog') { var h=false; for (var k=0;k<a.db.length;k++) if (a.db[k].t==='speedDouble') h=true; aD=h?5:1; } else if (a.k==='chess') aD=a.cS!=='i'?5:1; else if (TY[a.k]&&TY[a.k].ig) aD=0; else aD=1;
          if (b.k==='zombie') bD=b.zD||1; else if (b.k==='diamondMinion') bD=5; else if (b.k==='jadeRabbit') bD=3; else if (b.k==='dog') { var h=false; for (var k=0;k<b.db.length;k++) if (b.db[k].t==='speedDouble') h=true; bD=h?5:1; } else if (b.k==='chess') bD=b.cS!=='i'?5:1; else if (TY[b.k]&&TY[b.k].ig) bD=0; else bD=1;
          if (aD>0 && !(a.k==='icer'&&b.k!=='zombie')) a.tD(bD,b);   // 冰冰冰免疫碰撞傷害（僵屍除外）
          if (bD>0 && !(b.k==='icer'&&a.k!=='zombie')) b.tD(aD,a);
          if (a.k==='diamondMinion'&&aD>0) a.hp=0;
          if (b.k==='diamondMinion'&&bD>0) b.hp=0;
          if (a.k==='fire') addBurn(b,1,6e3);
          if (b.k==='fire') addBurn(a,1,6e3);
        }
      }
    }
  }
}

  for (var i=0;i<TB.length;i++) { var bm=TB[i]; cx.save(); cx.translate(bm.x,bm.y); cx.font='18px Arial'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('💎',0,0); cx.fillStyle='#fff'; cx.font='10px Arial'; cx.fillText((bm.fuse/1e3).toFixed(1),0,14); cx.restore(); }
  for (var i=0;i<B.length;i++) B[i].draw();
  for (var i=0;i<PJ.length;i++) {
    var p=PJ[i]; cx.save(); cx.translate(p.x,p.y);
    var bc=p.bC||(p.o?p.o.cl:'#fff');
    if (p.tp==='sv') { cx.fillStyle='rgba(123,90,130,.6)'; cx.beginPath(); cx.arc(0,0,p.radius||40,0,Math.PI*2); cx.fill(); cx.strokeStyle='#7B5A82'; cx.lineWidth=2; cx.stroke(); cx.fillStyle='#7B5A82'; cx.font='14px Arial'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('🌀',0,0); }
    else if (p.tp==='moon') { cx.fillStyle='#ffffaa'; cx.beginPath(); cx.arc(0,0,p.radius||30,0,Math.PI*2); cx.fill(); cx.font='20px Arial'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('🌕',0,0); }
    else if (p.tp==='ms') { cx.fillStyle='#ff9f43'; cx.beginPath(); cx.moveTo(0,-8); cx.lineTo(7,6); cx.lineTo(-7,6); cx.closePath(); cx.fill(); }
    else if (p.tp==='sb') { cx.fillStyle='#9b59b6'; cx.beginPath(); cx.arc(0,0,5,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='bat') { cx.fillStyle='#8e44ad'; cx.beginPath(); cx.arc(0,0,p.radius||12,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='mufo') { cx.fillStyle='#ecf0f1'; cx.beginPath(); cx.arc(0,0,p.radius||14,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='rr') { cx.fillStyle='rgba(46,204,113,.8)'; cx.beginPath(); cx.arc(0,0,5,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='fm') { cx.fillStyle=p.ft==='blue'?'#5dade2':'#ec7063'; cx.beginPath(); cx.arc(0,0,p.radius||10,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='tt') { cx.save(); cx.rotate((performance.now()/80)%(Math.PI*2)); cx.strokeStyle='#adf'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(-14,0); cx.lineTo(16,0); cx.stroke(); cx.restore(); }
    else if (p.tp==='pt') { cx.fillStyle='#6b3e15'; cx.beginPath(); cx.arc(0,0,p.radius||14,0,Math.PI*2); cx.fill(); cx.font='18px Arial'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('💩',0,1); }
    else if (p.tp==='sd') { cx.strokeStyle='#ffd700'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(0,-16); cx.lineTo(0,8); cx.stroke(); }
    else if (p.tp==='ts') { cx.strokeStyle='#ffd700'; cx.lineWidth=6; cx.beginPath(); cx.moveTo(0,-35); cx.lineTo(0,35); cx.stroke(); }
    else if (p.tp==='bb') { cx.fillStyle=bc; if (p.laser) { cx.strokeStyle=bc; cx.lineWidth=3; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(p.vx*3,p.vy*3); cx.stroke(); } else { cx.beginPath(); cx.arc(0,0,6,0,Math.PI*2); cx.fill(); } }
    else if (p.tp==='b2p') { cx.fillStyle='rgba(128,0,128,.6)'; cx.beginPath(); cx.arc(0,0,p.radius||40,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='b2e') { cx.fillStyle='#ffd700'; cx.beginPath(); cx.arc(0,0,p.radius||18,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='b2a') { cx.fillStyle='#006400'; cx.beginPath(); cx.arc(0,0,p.radius||22,0,Math.PI*2); cx.fill(); }
    else if (p.tp==='b2f') { cx.fillStyle='rgba(255,60,0,.6)'; cx.beginPath(); cx.arc(0,0,25,0,Math.PI*2); cx.fill(); }
    else { cx.fillStyle='#fff'; cx.beginPath(); cx.arc(0,0,p.radius||6,0,Math.PI*2); cx.fill(); }
    cx.restore();
  }
  cx.font='11px Arial'; for (var i=0;i<TF.length;i++) { var e=TF[i]; cx.globalAlpha=e.l/e.ml; cx.fillStyle=e.c; cx.textAlign='center'; cx.fillText(e.t,e.x,e.y); } cx.globalAlpha=1;
  cx.restore();
  if (FIN) drawFINWorld();
  if (fcam) cx.restore();
  if (FIN) drawFINScreen();
  var al=0; for (var i=0;i<B.length;i++) if (B[i].hp>0&&!B[i].card) al++; ge('ac').textContent=al;
}

// ===== Game Loop =====
function stepSim(dt) {
  {
    FR++;
    var nw=performance.now();
    ITmr+=dt; if (ITmr>=3e4) { ITmr-=3e4; spIt(); }
    if (!TS) { for (var i=0;i<B.length;i++) B[i].upd(dt); uCards(dt); cCol(); uPJ(dt); checkMoonFlowers(); } else { uPJ(dt); if (nw>TSE) TS=false; }
    eDG(); uSN(dt); uTI(dt); uEf(dt); uIce(dt); uEJ(dt);
    // Jade rabbit death → transform others
    for (var i=B.length-1;i>=0;i--) { if (B[i].hp<=0&&B[i].k==='jadeRabbit') { var owner=B[i].moonOwner; for (var j=0;j<B.length;j++) { if (B[j].k==='jadeRabbit'&&B[j].hp>0&&B[j]!==B[i]) { var nk=Math.random()<.5?'brother':'brother2'; var nb=new Bl(nk,B[j].x,B[j].y,false,B[j].tm); nb.hp=1; nb.mhp=1; nb.moonLv=owner?owner.moonLv:0; B[j]=nb; aT(nb.x,nb.y-20,'🐰→'+(nk==='brother'?'大哥':'二哥')+'!','#f0f0ff',1500); } } } }
    // Death handling
    for (var i=B.length-1;i>=0;i--) if (B[i].hp<=0) {
      if (B[i].card) { B.splice(i,1); continue; }   // 書與筆的卡片到期：直接移除
      if (B[i].k==='icer'&&!B[i].ultUsed) { B[i].hp=1; B[i].sIU(); continue; }   // 其他途徑致死也免死一次
      if (B[i].k==='schrodinger'&&B[i].rFS()) continue;
      if (B[i].k==='fire'&&B[i].kl&&B[i].kl.hp>0) B[i].kl.tD(10,'fb',true);
      bpFin(B[i]);                                  // 書與筆1對1擊殺 → 斬殺動畫
      if (ZM&&!ZM.ov&&B[i].k==='zombie') ZM.kc=(ZM.kc||0)+1;
      if (ZM&&!ZM.ov&&B[i].k!=='zombie') { var z=new Bl('zombie',B[i].x,B[i].y,false,2); z.hp=50+ZM.w*50; z.mhp=z.hp; z.zD=1+ZM.w; B.push(z); aT(B[i].x,B[i].y,'🧟僵屍!','#7f8c8d',1200); }
      B[i].sh=[]; snd('d'); B.splice(i,1);
    }
    // Zombie wave progression
    if (ZM&&!ZM.ov&&ZM.go) {
      if (ZM.w<=ZM.tw) { ZM.st+=dt; if (ZM.st>=500) { ZM.st-=500; spZ(1); } }
      if ((ZM.kc||0)>=50) { ZM.kc=0; if (ZM.w<ZM.tw) { ZM.w++; spZ(25); } else eZW(true); }
      var ch=0; for (var i=0;i<B.length;i++) if (B[i].k!=='zombie') ch++; if (ch===0) eZW(false);
    }
  }
}
// 固定時間步長：不論螢幕 60/120/144Hz，模擬都是 60 步 = 1 秒
var ACC=0, STEP=1000/60;
function loop() {
  try {
    var nw=performance.now(), d=nw-LT; LT=nw; if (d>100) d=100;
    if (SP) { draw(); requestAnimationFrame(loop); return; }
    if (FIN) { updFIN(d); ACC=0; }   // 斬殺動畫期間，模擬暫停
    else {
      ACC+=d; var n=0;
      while (ACC>=STEP && n<6 && !FIN) { ACC-=STEP; n++; stepSim(STEP); }
      if (ACC>=STEP) ACC=0;
    }
    draw();
  } catch(er) { showErr('loop:'+er.message); }
  requestAnimationFrame(loop);
}

// ===== Clear All =====
function clearAll() { FIN=null; ICE=[]; EJ=[]; B=[]; PJ=[]; TF=[]; SF=[]; PZ=[]; IT=[]; SU=[]; SN=[]; TA=[]; TG=[]; TB=[]; mF=[]; SK={x:0,y:0,t:0,i:6}; ITmr=0; TS=false; TY.sword.uU=false; TY.radiation.uU=false; PI.on=false; SM('sandbox'); ST=0; ZM=null; EG.jb.clear(); EG.ie.clear(); EG.di.clear(); EG.at=0; }

// ===== Start =====
uTT();
requestAnimationFrame(loop);
</script>
